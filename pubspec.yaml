name: ligueypro_2_0
description: LigueyPro 2.0 - Marketplace sénégalaise de services.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  intl: ^0.20.2
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/ligueyPro2.0.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/ligueyPro2.0.png
